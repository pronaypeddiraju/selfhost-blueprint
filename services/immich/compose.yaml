services:
  immich-server:
    container_name: ${DOCKER_PREFIX:-}immich_server
    # tag: release (pinned 2026-10-28)
    image: ghcr.io/immich-app/immich-server:release@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/immich/upload:/usr/src/app/upload
      - ${DATA_DIR}/immich/library:/usr/src/app/library
      - ${DATA_DIR}/immich/database:/usr/src/app/database
    environment:
      - TZ=${TZ:-UTC}
      - DB_HOSTNAME=database
      - DB_PORT=5432
      - DB_USERNAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis
    ports:
      - "${IMMICH_HTTP_PORT:-2283}:3001"
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: ${DOCKER_PREFIX:-}immich_machine_learning
    # tag: release (pinned 2026-10-28)
    image: ghcr.io/immich-app/immich-machine-learning:release@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/immich/machine_learning:/cache
    environment:
      - TZ=${TZ:-UTC}
      - REDIS_HOSTNAME=redis
    # Uncomment the device block below to enable NVIDIA GPU acceleration for ML.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  redis:
    container_name: ${DOCKER_PREFIX:-}immich_redis
    # tag: 6.2-alpine (pinned 2026-10-28)
    image: redis:6.2-alpine@sha256:63d5174750e285bc3069c4519c53c8b6de6ebe70715140a6c9d21d6f04b77319
    restart: unless-stopped

  database:
    container_name: ${DOCKER_PREFIX:-}immich_postgres
    # tag: release (pinned 2026-10-28)
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=immich
      - POSTGRES_DB=immich
    volumes:
      - ${DATA_DIR}/immich/database:/var/lib/postgresql/data
