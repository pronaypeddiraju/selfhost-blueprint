services:
  uptimekuma:
    # tag: 1 (pinned 2026-10-28)
    image: louislam/uptime-kuma:1@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
    container_name: ${DOCKER_PREFIX:-}uptimekuma
    restart: unless-stopped
    ports:
      - "${UPTIMEKUMA_HTTP_PORT:-3001}:3001"
    volumes:
      - ${DATA_DIR}/uptimekuma:/app/data
    environment:
      - TZ=${TZ:-UTC}
